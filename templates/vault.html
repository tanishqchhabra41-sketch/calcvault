<!DOCTYPE html>
<html>

<head>

    <title>Secret Vault</title>

    <style>

        body{

            margin:0;
            padding:0;

            background:#111;

            color:white;

            font-family:Arial;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;
        }

        .vault{

            width:500px;

            background:#1c1c1c;

            padding:30px;

            border-radius:20px;

            box-shadow:
            0 0 20px rgba(0,0,0,0.5);
        }

        h1{

            text-align:center;
        }

        textarea{

            width:100%;
            height:250px;

            background:#2a2a2a;

            border:none;

            border-radius:15px;

            color:white;

            font-size:18px;

            padding:15px;

            box-sizing:border-box;

            resize:none;

            margin-bottom:20px;
        }

        input{

            width:100%;

            height:50px;

            background:#2a2a2a;

            border:none;

            border-radius:15px;

            color:white;

            font-size:18px;

            padding-left:15px;

            margin-bottom:20px;

            box-sizing:border-box;
        }

        button{

            width:100%;

            height:50px;

            border:none;

            border-radius:15px;

            background:#ff9500;

            color:white;

            font-size:18px;

            cursor:pointer;

            margin-bottom:15px;
        }

    </style>

</head>

<body>

<div class="vault">

    <h1>🔒 Secret Vault</h1>

    <!-- NOTES -->

    <form action="/save_notes" method="POST">

        <textarea
        name="notes"
        placeholder="Write secret notes here...">{{ notes }}</textarea>

        <button type="submit">

            Save Notes

        </button>

    </form>


    <!-- CHANGE SECRET CODE -->

    <form action="/set_code" method="POST">

        <input
        type="password"
        name="secret_code"
        placeholder="Set New Secret Code"
        required>

        <button type="submit">

            Change Secret Code

        </button>

    </form>
<a href="/">

    <button>

        Back to Calculator

    </button>

</a>
</div>

</body>
</html>
